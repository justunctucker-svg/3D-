<title>Abrams Drone Tank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed WebGL stage; title + gauges in the top corners, caption and transport bar along the bottom edge */
  :root {
    --ink: #0a0b0d;
    --panel: rgba(14, 16, 19, 0.72);
    --line: rgba(196, 210, 222, 0.16);
    --fg: #e8ecef;
    --muted: #8c959e;
    --xray: #74d4ff;
    --flash: #ffb24a;
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--fg);
    font-family: var(--mono);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }

  .hud {
    position: fixed; inset: 0;
    pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .brand h1 {
    margin: 0;
    font-family: var(--display); font-weight: 700;
    font-size: clamp(22px, 3.2vw, 34px); line-height: 0.95;
    letter-spacing: 0.02em; text-transform: uppercase;
  }
  .brand p {
    margin: 6px 0 0; color: var(--muted);
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .mode {
    display: inline-block; margin-top: 10px; padding: 3px 8px;
    border: 1px solid var(--xray); color: var(--xray);
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    opacity: 0; transition: opacity .3s;
  }
  .mode.on { opacity: 1; }

  .gauges {
    display: grid; grid-template-columns: auto auto; column-gap: 14px; row-gap: 5px;
    padding: 10px 12px; background: var(--panel); border: 1px solid var(--line);
    font-size: 11px; font-variant-numeric: tabular-nums;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .gauges dt { color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; align-self: center; }
  .gauges dd { margin: 0; text-align: right; min-width: 9ch; }
  .pips { display: inline-flex; gap: 4px; vertical-align: middle; }
  .pips i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid #c9a24f; background: #c9a24f; }
  .pips i.spent { background: transparent; border-color: #6a5a3a; }
  .pips i.empty { background: transparent; border-color: #3a3f45; }

  .bottom { display: flex; flex-direction: column; gap: 12px; }
  .caption { max-width: 46ch; min-height: 92px; display: flex; flex-direction: column; justify-content: flex-end; }
  .caption .step {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--flash);
    min-height: 1.3em;
  }
  .caption .step.x { color: var(--xray); }
  .caption .text {
    margin: 4px 0 0;
    font-family: var(--display); font-weight: 600;
    font-size: clamp(19px, 2.4vw, 27px); line-height: 1.12; text-wrap: balance;
    text-shadow: 0 1px 12px rgba(0,0,0,.6);
  }
  .caption > * { transition: opacity .25s; }
  .caption.swap > * { opacity: 0; }

  .transport {
    pointer-events: auto;
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px;
    padding: 8px 10px; background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .transport button {
    font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--fg); background: transparent; border: 1px solid var(--line);
    padding: 8px 10px; min-height: 32px; cursor: pointer; white-space: nowrap;
  }
  .transport button:hover { border-color: var(--muted); }
  .transport button:focus-visible, .scrub input:focus-visible { outline: 2px solid var(--xray); outline-offset: 2px; }
  .transport button[aria-pressed="true"] { border-color: var(--xray); color: var(--xray); }
  #play { width: 40px; padding: 0; display: grid; place-items: center; }
  #play svg { width: 12px; height: 12px; fill: currentColor; }
  .scrub { flex: 1 1 220px; min-width: 0; position: relative; height: 32px; display: flex; align-items: center; }
  .scrub input { width: 100%; margin: 0; appearance: none; -webkit-appearance: none; background: transparent; height: 32px; position: relative; z-index: 1; cursor: pointer; }
  .scrub input::-webkit-slider-runnable-track { height: 2px; background: transparent; }
  .scrub input::-moz-range-track { height: 2px; background: transparent; }
  .scrub input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%; background: var(--fg); border: 0; }
  .scrub input::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--fg); border: 0; }
  .track { position: absolute; left: 6px; right: 6px; top: 15px; height: 2px; background: var(--line); }
  .track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--muted); }
  .track .seg { position: absolute; top: -3px; height: 8px; border-left: 1px solid var(--muted); }
  .track .seg.x { background: rgba(116, 212, 255, 0.18); border-left-color: var(--xray); }
  .time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 9ch; text-align: right; }
  .hint { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; }

  /* Shorts recording layout (9:16): keeps text clear of the YouTube Shorts overlay at the bottom and right edge */
  body.video .transport { display: none; }
  body.video .hud { padding-top: 30px; }
  body.video .top { flex-direction: column; gap: 0; }
  body.video .brand h1 { font-size: 30px; }
  body.video .brand p { display: block; font-size: 9px; }
  body.video .mode { position: absolute; top: 34px; right: 16px; margin: 0; }
  body.video .gauges {
    position: absolute; left: 16px; right: 16px; top: 66%;
    grid-template-columns: none; grid-template-rows: auto auto; grid-auto-flow: column;
    column-gap: 8px; row-gap: 3px; padding: 8px 10px; font-size: 10px;
  }
  body.video .gauges dt { font-size: 8px; }
  body.video .gauges dd { text-align: left; min-width: 0; white-space: nowrap; }
  body.video .bottom { position: absolute; top: 128px; left: 16px; right: 60px; }
  body.video .caption { min-height: 0; justify-content: flex-start; }
  body.video .caption .text { font-size: 19px; }
  body.video .caption > * { transition: none; }

  @media (max-width: 640px) {
    .gauges { font-size: 10px; padding: 8px 10px; column-gap: 10px; }
    .gauges dd { min-width: 7ch; }
    .brand p { display: none; }
    .caption { min-height: 76px; }
    .hint { display: none; }
  }
  @media (max-width: 420px) {
    .top { flex-direction: column; }
  }

  [hidden] { display: none !important; }
  .hud { z-index: 2; }
  #callouts { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .callout { position: absolute; left: 0; top: 0; opacity: 0; font: 500 10.5px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg); }
  .callout .dot { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--flash); box-shadow: 0 0 0 3px rgba(0,0,0,0.35); }
  .callout .line { position: absolute; left: 0; top: 0; height: 1px; background: rgba(232,236,239,0.75); transform-origin: 0 0; }
  .callout .tag { position: absolute; left: 0; top: 0; white-space: nowrap; padding: 4px 7px; background: rgba(12,14,17,0.82); border: 1px solid var(--line); border-left: 2px solid var(--flash); }
  .callout.x .dot { background: var(--xray); }
  .callout.x .tag { border-left-color: var(--xray); }
  #pip { position: fixed; top: 170px; right: max(16px, env(safe-area-inset-right, 0px)); width: min(34vw, 320px); aspect-ratio: 16 / 10; z-index: 3; pointer-events: none;
    border: 1px solid rgba(255, 90, 80, 0.8); backdrop-filter: grayscale(1) contrast(1.3) brightness(1.7); -webkit-backdrop-filter: grayscale(1) contrast(1.3) brightness(1.7); }
  #pip svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #pip canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #pip .lbl { position: absolute; left: 7px; top: 6px; font: 500 9.5px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: #ff6a5a; text-shadow: 0 0 4px #000; }
  #pip .lock { top: auto; bottom: 6px; }
  .dpips { display: inline-flex; gap: 4px; align-items: center; vertical-align: middle; }
  .dpips i { width: 8px; height: 8px; border-radius: 50%; background: #d4d9de; }
  .dpips i.big { width: 12px; height: 12px; }
  .dpips i.fly { background: transparent; box-shadow: inset 0 0 0 1.5px var(--xray); }
  .dpips i.done { background: #3a3f45; }
  body.video #pip { top: 268px; right: 16px; width: 200px; }
  body.video .callout { font-size: 9.5px; }
  @media (max-width: 640px) { #pip { top: 200px; width: 46vw; } }
</style>

<div id="stage"></div>
<div id="callouts"></div>
<div id="pip" hidden>
  <canvas id="pipStatic" width="96" height="60" hidden></canvas>
  <svg viewBox="0 0 160 100" preserveAspectRatio="none" aria-hidden="true">
    <g fill="none" stroke="#ff4a3d" stroke-width="1.2">
      <path d="M62 36 h-8 v8 M98 36 h8 v8 M62 64 h-8 v-8 M98 64 h8 v-8"/>
      <circle cx="80" cy="50" r="9"/>
      <path d="M80 30 v10 M80 60 v10 M60 50 h10 M90 50 h10"/>
    </g>
  </svg>
  <div class="lbl" id="pipLbl">Switchblade 300 · #1 · EO</div>
  <div class="lbl lock" id="pipLock">Target locked</div>
</div>

<div class="hud">
  <div class="top">
    <div class="brand">
      <h1>Abrams<br>Drone Tank</h1>
      <p>AbramsX-style · PERCH launcher · 4 Switchblades</p>
      <span class="mode" id="modeTag">X-ray view</span>
    </div>
    <dl class="gauges" aria-label="Live readouts">
      <dt>Stage</dt><dd id="gStage">Driving in</dd>
      <dt>Main gun</dt><dd id="gGun">Ready</dd>
      <dt>Drones</dt><dd><span class="dpips" id="dpips"><i></i><i></i><i></i><i class="big"></i></span></dd>
      <dt>Drone speed</dt><dd id="gVel">0 km/h</dd>
    </dl>
  </div>

  <div class="bottom">
    <div class="caption" id="caption" aria-live="polite">
      <div class="step" id="capStep"></div>
      <p class="text" id="capText"></p>
    </div>
    <div class="transport">
      <button id="play" aria-label="Pause"><svg viewBox="0 0 12 12" id="playIcon"><rect x="1" y="1" width="3.5" height="10"/><rect x="7.5" y="1" width="3.5" height="10"/></svg></button>
      <div class="scrub">
        <div class="track" id="track"><div class="fill" id="fill"></div></div>
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Timeline">
      </div>
      <span class="time" id="time">0.0 s</span>
      <button id="xray" aria-pressed="false" title="X-ray: auto, on, off">X-ray: Auto</button>
      <button id="speed" title="Playback speed">1×</button>
      <button id="cam" aria-pressed="false" title="Drag the scene to orbit freely">Camera: Director</button>
      <span class="hint">Drag to orbit</span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
  const T = THREE;
  const PI = Math.PI;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = k => { k = clamp(k); return k * k * (3 - 2 * k); };
  const easeOut = k => { k = clamp(k); return 1 - Math.pow(1 - k, 3); };
  const easeIn = k => { k = clamp(k); return k * k * k; };
  const span = (t, a, b) => clamp((t - a) / (b - a));
  const pulse = (t, a, b, c, d) => smooth(span(t, a, b)) * (1 - smooth(span(t, c, d)));
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (i, j) => { const x = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return x - Math.floor(x); };
  const V = (x, y, z) => new T.Vector3(x, y, z);

  // ---------------------------------------------------------------- renderer
  const stage = document.getElementById('stage');
  const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  stage.appendChild(renderer.domElement);
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(32, 1, 0.1, 4000);
  const HORIZON = new T.Color(0.40, 0.44, 0.48), XRAY_FOG = new T.Color(0.0, 0.01, 0.02);
  scene.fog = new T.Fog(HORIZON.clone(), 220, 2200);

  {
    const env = new T.Scene();
    env.add(new T.Mesh(new T.BoxGeometry(60, 30, 60), new T.MeshBasicMaterial({ color: 0x15171a, side: T.BackSide })));
    const box = (w, h, x, y, z, ry, rx, c) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: c, side: T.DoubleSide })); m.position.set(x, y, z); m.rotation.set(rx || 0, ry || 0, 0); env.add(m); };
    box(40, 40, 0, 14.5, 0, 0, PI / 2, new T.Color(0.75, 0.8, 0.9));
    box(4, 22, -24, 2, 8, PI / 2.6, 0, new T.Color(1.2, 1.2, 1.25));
    box(30, 3, 0, 4, -28, 0, 0, new T.Color(0.9, 0.8, 0.65));
    scene.environment = new T.PMREMGenerator(renderer).fromScene(env, 0.02).texture;
  }
  const sun = new T.DirectionalLight(0xfff0dc, 1.7); sun.position.set(-60, 90, 70); scene.add(sun);
  scene.add(new T.HemisphereLight(0xc7d6e6, 0x5b5242, 0.45));

  const bgMat = new T.ShaderMaterial({
    uniforms: { uX: { value: 0 }, uRes: { value: new T.Vector2(1, 1) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.0); }',
    fragmentShader: `
      varying vec2 vUv; uniform float uX; uniform vec2 uRes;
      void main(){
        vec3 solid = mix(vec3(0.40, 0.44, 0.48), vec3(0.16, 0.24, 0.34), smoothstep(0.3, 1.0, vUv.y));
        vec2 c = vUv - vec2(0.5, 0.56); c.x *= uRes.x / uRes.y; float r = length(c);
        vec3 xr = mix(vec3(0.006, 0.032, 0.055), vec3(0.0, 0.004, 0.009), smoothstep(0.0, 0.95, r));
        vec2 g = gl_FragCoord.xy / (uRes.y / 18.0); vec2 f = abs(fract(g) - 0.5);
        float line = 1.0 - smoothstep(0.0, 0.035, min(f.x, f.y));
        xr += vec3(0.010, 0.040, 0.060) * line * (1.0 - smoothstep(0.2, 1.0, r));
        gl_FragColor = vec4(mix(solid, xr, uX), 1.0);
      }`,
    depthWrite: false, depthTest: false
  });
  const bg = new T.Mesh(new T.PlaneGeometry(2, 2), bgMat);
  bg.frustumCulled = false; bg.renderOrder = -10; scene.add(bg);

  // ---------------------------------------------------------------- geometry helpers
  function autoSmooth(geo, angle) {
    const g = geo.index ? geo.toNonIndexed() : geo;
    const p = g.attributes.position, n = p.count, faces = n / 3;
    const fa = new Float32Array(faces * 3), fu = new Float32Array(faces * 3);
    const a = new T.Vector3(), b = new T.Vector3(), c = new T.Vector3();
    for (let f = 0; f < faces; f++) {
      a.fromBufferAttribute(p, f * 3); b.fromBufferAttribute(p, f * 3 + 1); c.fromBufferAttribute(p, f * 3 + 2);
      b.sub(a); c.sub(a); b.cross(c);
      fa[f * 3] = b.x; fa[f * 3 + 1] = b.y; fa[f * 3 + 2] = b.z;
      b.normalize(); fu[f * 3] = b.x; fu[f * 3 + 1] = b.y; fu[f * 3 + 2] = b.z;
    }
    const groups = new Map();
    for (let i = 0; i < n; i++) {
      const k = Math.round(p.getX(i) * 1e4) + ',' + Math.round(p.getY(i) * 1e4) + ',' + Math.round(p.getZ(i) * 1e4);
      let l = groups.get(k); if (!l) groups.set(k, l = []); l.push(i);
    }
    const cosT = Math.cos(angle * PI / 180), out = new Float32Array(n * 3);
    groups.forEach(list => {
      for (const i of list) {
        const fi = (i / 3 | 0) * 3; let x = 0, y = 0, z = 0;
        for (const j of list) {
          const fj = (j / 3 | 0) * 3;
          if (fu[fi] * fu[fj] + fu[fi + 1] * fu[fj + 1] + fu[fi + 2] * fu[fj + 2] >= cosT) { x += fa[fj]; y += fa[fj + 1]; z += fa[fj + 2]; }
        }
        const l = Math.hypot(x, y, z) || 1; out[i * 3] = x / l; out[i * 3 + 1] = y / l; out[i * 3 + 2] = z / l;
      }
    });
    g.setAttribute('normal', new T.BufferAttribute(out, 3));
    return g;
  }
  // side profile (x, y) extruded across z, centred
  function extrudeZ(pts, depth, bevel = 0.04) {
    const s = new T.Shape(); pts.forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y));
    const g = new T.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2 });
    g.translate(0, 0, -depth / 2); return autoSmooth(g, 40);
  }
  // top-view outline (x, z) extruded upward from y = 0
  function extrudeY(pts, height, bevel = 0.05) {
    const s = new T.Shape(); pts.forEach(([x, z], i) => i ? s.lineTo(x, -z) : s.moveTo(x, -z));
    const g = new T.ExtrudeGeometry(s, { depth: height, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2 });
    g.rotateX(-PI / 2); g.translate(0, bevel, 0); return autoSmooth(g, 40);
  }
  const alongX = g => g.rotateZ(-PI / 2);
  const lathe = (pts, seg = 32) => alongX(new T.LatheGeometry(pts.map(([r, x]) => new T.Vector2(r, x)), seg));
  const cylX = (r, len, seg = 20, r2) => alongX(new T.CylinderGeometry(r2 === undefined ? r : r2, r, len, seg));
  const cylZ = (r, len, seg = 24) => new T.CylinderGeometry(r, r, len, seg).rotateX(PI / 2);
  const canvasTex = (w, h, draw) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h); const t = new T.CanvasTexture(cv); t.wrapS = t.wrapT = T.RepeatWrapping; return t; };

  // ---------------------------------------------------------------- materials
  const std = (color, metalness, roughness, extra = {}) => { const m = new T.MeshStandardMaterial(Object.assign({ color, metalness, roughness }, extra)); m.color.convertSRGBToLinear(); return m; };
  const paint = std(0x8e959b, 0.35, 0.55);
  const paintDark = std(0x41464c, 0.4, 0.6);
  const trackMat = std(0x2b2d30, 0.55, 0.7);
  const rubber = std(0x18191a, 0, 0.85);
  const metal = std(0x9aa1a8, 0.85, 0.35);
  const glass = std(0x0a0e12, 0.9, 0.08);
  const perchMat = std(0x868d93, 0.35, 0.55);
  const droneBody = std(0xc6cad0, 0.4, 0.45);
  const droneWing = std(0x3a3e44, 0.3, 0.6);
  const lampMat = new T.MeshBasicMaterial({ color: new T.Color(3, 3, 2.8), toneMapped: false });
  // internals (stay solid in x-ray)
  const uniform = std(0xa88f62, 0, 0.8), helmet = std(0x4b5535, 0.1, 0.6), seatMat = std(0x2e3236, 0.2, 0.7);
  const screenMat = new T.MeshBasicMaterial({ color: new T.Color(0.35, 1.1, 1.4), toneMapped: false });

      const rest = b.pos.clone().add(sh.p);
      let pos = rest, rot = b.rot;
      if (tau > 0) {
        const dir = rest.clone().sub(h.c).add(V(0, 1.2, 0)).normalize();
        const sp = (7 + rand(i, 1) * 12) * h.power;
        const vel = dir.multiplyScalar(sp).add(V((rand(i, 2) - 0.5) * 4, 4 * h.power, (rand(i, 3) - 0.5) * 4));
        const g = 9.8, y0 = rest.y, ground = 0.08;
        const tl = (vel.y + Math.sqrt(vel.y * vel.y + 2 * g * (y0 - ground))) / g;
        const tt = Math.min(tau, tl);
        pos = V(rest.x + vel.x * tt, Math.max(ground, y0 + vel.y * tt - 0.5 * g * tt * tt), rest.z + vel.z * tt);
        rot = new T.Euler(b.rot.x + (rand(i, 4) - 0.5) * 14 * tt, (rand(i, 5) - 0.5) * 10 * tt, (rand(i, 6) - 0.5) * 14 * tt);
        if (tau >= tl) rot = new T.Euler(PI / 2 * Math.round(rot.x / (PI / 2)), rot.y, PI / 2 * Math.round(rot.z / (PI / 2)));
      }
      _m.compose(pos, _q.setFromEuler(rot), b.size); boardMesh.setMatrixAt(i, _m);
    });
    boardMesh.instanceMatrix.needsUpdate = true;

    // explosions, fire, sparks
    let lightI = 0, lightP = null;
    hits.forEach((h, j) => {
      const E = explosions[j], tau = t - h.t, on = tau > 0;
      const f = on ? Math.exp(-tau / 0.35) : 0;
      E.flash.visible = f > 0.01; E.flash.position.copy(h.c).add(V(0, 1.5, 0)); E.flash.scale.setScalar((10 + 26 * (1 - f)) * h.power); E.flash.material.opacity = f;
      if (f * 8 > lightI) { lightI = f * 8; lightP = E.flash.position; }
      E.shock.visible = on && tau < 1.6; E.shock.position.set(h.c.x, 0.15, h.c.z); E.shock.scale.setScalar(1 + easeOut(tau / 1.6) * 40 * h.power); E.shock.material.opacity = 0.16 * (1 - clamp(tau / 1.6));
      E.scorch.visible = on; E.scorch.position.set(h.c.x, 0.04, h.c.z); E.scorch.scale.setScalar(3.2 * h.power * SHEDS[j].s); E.scorch.material.opacity = 0.55;
      E.fire.forEach((s, k) => {
        const life = on ? clamp(1 - (tau - 6) / 10) : 0;
        s.visible = on && life > 0;
        if (!s.visible) return;
        const fl = 0.7 + 0.3 * Math.sin(wall * 13 + k * 2.1) * Math.sin(wall * 7.3 + k);
        s.position.set(h.c.x + (rand(j, k) - 0.5) * 3, 0.8 + rand(j, k + 5) * 1.5 + fl * 0.4, h.c.z + (rand(j, k + 9) - 0.5) * 3);
        s.scale.setScalar((2.2 + rand(j, k + 2) * 1.5) * fl * (0.4 + 0.6 * Math.max(life, Math.exp(-tau / 1.2))));
        s.material.opacity = 0.75 * fl * life;
      });
      E.sparks.forEach((s, k) => {
        const kk = tau / 1.4; s.visible = on && kk < 1;
        if (!s.visible) return;
        const a = rand(j * 20 + k, 1) * 2 * PI, up = 0.3 + rand(j * 20 + k, 2), sp = (14 + rand(j * 20 + k, 3) * 18) * h.power, e = easeOut(kk);
        s.position.set(h.c.x + Math.cos(a) * sp * e, h.c.y + up * sp * 0.7 * e - kk * kk * 12, h.c.z + Math.sin(a) * sp * e);
        s.scale.setScalar(0.9 * (1 - kk)); s.material.opacity = 1 - kk;
      });
    });
    if (flashI * 10 > lightI) { lightI = flashI * 10; lightP = flashPos; }
    flashLight.intensity = lightI; if (lightP) flashLight.position.copy(lightP);

    // smoke: drive dust, muzzle blast, launch puffs, explosion clouds, smoke columns
    let si = 0;
    const puff = (x, y, z, scale, op, rot, col) => {
      if (si >= smokePool.length || op <= 0.003) return;
      const s = smokePool[si++]; s.visible = true; s.position.set(x, y, z); s.scale.setScalar(scale); s.material.opacity = op; s.material.rotation = rot; s.material.color.setHex(col);
    };
    for (let p = 0; p < 22; p++) {
      const birth = p * 0.27, age = (t - birth) / 2.6; if (age <= 0 || age >= 1 || birth > DRIVE_END - 0.6) continue;
      const x = driveX(birth) - 4.2, s = p % 2 ? 1 : -1;
      puff(x - age * 2, 0.4 + age * 1.6, s * 1.6 + s * age * 1.2, 1 + age * 4, 0.3 * Math.pow(1 - age, 1.5) * Math.min(1, age * 8), rand(p, 1) * 6, 0x9a8c72);
    }
    const mz = gun.localToWorld(MUZZLE.clone()), mdir = gun.localToWorld(V(7, 0, 0)).sub(mz).normalize();
    for (let p = 0; p < 18; p++) {
      const age = (t - FIRE - p * 0.01) / (3.5 + rand(p, 1) * 2); if (age <= 0 || age >= 1) continue;
      const dist = (1 - Math.exp(-age * 5)) * (3 + p * 0.6), a = rand(p, 2) * 2 * PI;
      puff(mz.x + mdir.x * dist + Math.cos(a) * dist * 0.3, mz.y + age * 2 + Math.sin(a) * dist * 0.15, mz.z + mdir.z * dist + Math.sin(a) * dist * 0.4, 1.5 + age * 7, 0.42 * Math.pow(1 - age, 1.4) * Math.min(1, age * 14), rand(p, 3) * 6, 0xa4a6a8);
    }
    for (let p = 0; p < 14; p++) {
      const age = (t - FIRE - p * 0.02) / (2.6 + rand(p, 4)); if (age <= 0 || age >= 1) continue;
      const a = rand(p, 5) * 2 * PI, dist = (1 - Math.exp(-age * 4)) * (4 + rand(p, 6) * 4);
      puff(tank.position.x + 4 + Math.cos(a) * dist, 0.5 + age, Math.sin(a) * dist, 1 + age * 4, 0.28 * Math.pow(1 - age, 1.5) * Math.min(1, age * 10), rand(p, 7) * 6, 0x9a8c72);
    }
    LAUNCH.forEach((L, i) => {
      for (let p = 0; p < 6; p++) {
        const age = (t - L - p * 0.03) / (2.2 + rand(i, p)); if (age <= 0 || age >= 1) continue;
        const P = paths[i], dist = (1 - Math.exp(-age * 4)) * (0.8 + p * 0.3);
        puff(P.muz.x + P.axis.x * dist, P.muz.y + P.axis.y * dist + age * 1.5, P.muz.z + P.axis.z * dist + (rand(i, p + 7) - 0.5) * age * 2, 0.5 + age * 2.6, 0.5 * Math.pow(1 - age, 1.5) * Math.min(1, age * 14), rand(i, p + 3) * 6, 0xd4d6d8);
      }
    });
    hits.forEach((h, j) => {
      const tau = t - h.t; if (tau <= 0) return;
      for (let p = 0; p < 12; p++) {
        const age = (tau - p * 0.02) / (3.5 + rand(j, p + 20) * 2); if (age <= 0 || age >= 1) continue;
        const a = rand(j, p + 30) * 2 * PI, dist = (1 - Math.exp(-age * 4)) * (5 + p * 0.5) * h.power;
        puff(h.c.x + Math.cos(a) * dist, 1 + rand(j, p) * 8 * age + age * 7 * h.power, h.c.z + Math.sin(a) * dist, (4 + age * 14) * h.power, 0.55 * Math.pow(1 - age, 1.3) * Math.min(1, age * 14), rand(j, p + 40) * 6, p % 3 ? 0x5b5048 : 0x3c3a38);
      }
      for (let p = 0; p < 8; p++) {
        const life = 7, ph = tau - p * (life / 8); if (ph < 0) continue;
        const age = (ph % life) / life, fade = clamp(1 - (tau - 22) / 6);
        puff(h.c.x + age * 10 + (rand(j, p) - 0.5) * 2, 2 + age * 32, h.c.z + age * 4, (3 + age * 12) * Math.min(1.3, h.power), 0.45 * Math.sin(PI * age) * fade, rand(j, p + 50) * 6, 0x3e3c3a);
      }
    });
    for (; si < smokePool.length; si++) smokePool[si].visible = false;

    // powertrain: energy flow, battery glow, fans
    const pw = pulse(t, 38.0, 39.0, 44.6, 45.4);
    flowTex.offset.x = -wall * 1.5; flowMat.opacity = pw;
    cables.forEach(c => { c.visible = pw > 0.01; });
    battMat.emissive.setRGB(0.05 * pw, 0.5 * pw * (0.7 + 0.3 * Math.sin(wall * 4)), 0.3 * pw);
    fans.forEach(f => { f.rotation.y = wall * 8; });

    // x-ray blend with per-system focus
    const xr = xMode === 'on' ? 1 : xMode === 'off' ? 0 : xrayAuto(t);
    xrayAmount += (xr - xrayAmount) * (xMode === 'auto' ? 1 : 0.15);
    const X = xrayAmount;
    const focus = FOCUS.find(f => t >= f[0] && t < f[1]);
    bgMat.uniforms.uX.value = X;
    xrayMats.forEach(mm => {
      const tag = mm.userData.tag, isF = !focus || focus[2].includes(tag);
      let o = X * (isF ? 1 : 0.32);
      if (tag === 'capsule') o = X * (focus && focus[2].includes('capsule') ? 1 : 0.15);
      mm.uniforms.uOpacity.value = o;
    });
    shells.forEach(({ solid, ghost }) => { ghost.visible = X > 0.005; solid.visible = X < 0.995; });
    fadeMats.forEach(mt => { mt.transparent = X > 0.005; mt.opacity = 1 - X; mt.depthWrite = X < 0.5; });
    envMats.forEach(mt => { mt.transparent = X > 0.005; mt.opacity = 1 - 0.9 * X; mt.depthWrite = X < 0.5; });
    internals.forEach(mm => { mm.visible = X > 0.005; });
    scene.fog.color.copy(HORIZON).lerp(XRAY_FOG, X);
    shadowMat.opacity = 1 - X;
    ui.modeTag.classList.toggle('on', X > 0.5);
    bloom.strength = 0.5 - 0.2 * X;

    // camera
    if (camMode === 'director') {
      const c = camAt(t), d = c.d;
      const target = v3.set(...c.tg);
      const shake = reducedMotion ? 0 : (blastI * 0.25 + lightI * 0.01) * Math.min(1, d / 30);
      camera.position.set(
        target.x + d * Math.sin(c.az) * Math.cos(c.el) + (rand(wall, 1) - 0.5) * shake,
        Math.max(0.6, target.y + d * Math.sin(c.el)) + (rand(wall, 2) - 0.5) * shake,
        target.z + d * Math.cos(c.az) * Math.cos(c.el));
      camera.lookAt(target);
      controls.target.copy(target);
    } else controls.update();
    const camDist = camera.position.distanceTo(controls.target);
    camera.near = Math.max(0.05, camDist * 0.25); camera.far = camDist * 8 + 2600;
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld();

    // drone markers and trails (need this frame's camera)
    dstates.forEach((st, i) => {
      const mk = markers[i], tr = trails[i];
      mk.visible = tr.visible = !!st;
      if (!st) return;
      const dist = camera.position.distanceTo(st.pos), far = clamp((dist - 30) / 50);
      mk.position.copy(st.pos); mk.scale.setScalar(Math.max(0.5, dist * 0.014)); mk.material.opacity = far * (0.75 + 0.25 * Math.sin(wall * 6 + i));
      mk.visible = far > 0.01;
      const arr = tr.geometry.attributes.position.array; let n = 0;
      for (let k = 0; k < TRAIL_N; k++) { const ps = droneState(i, t - k * 0.1); if (!ps) break; arr[n * 3] = ps.pos.x; arr[n * 3 + 1] = ps.pos.y; arr[n * 3 + 2] = ps.pos.z; n++; }
      tr.geometry.setDrawRange(0, n); tr.geometry.attributes.position.needsUpdate = true;
      tr.visible = n > 1 && far > 0.01;
    });

    // callouts
    const W2 = stage.clientWidth || innerWidth, H2 = stage.clientHeight || innerHeight;
    const capR = ui.cap.getBoundingClientRect(), gR = document.querySelector('.gauges').getBoundingClientRect();
    const band = videoMode ? [capR.bottom + 8, gR.top - 8] : [gR.bottom + 8, capR.top - 8];
    callouts.forEach(c => {
      const vis = pulse(t, c.t0, c.t0 + 0.35, c.t1 - 0.3, c.t1);
      if (vis <= 0.01) { c.el.style.opacity = 0; return; }
      c.obj.updateMatrixWorld(true);
      tmp.copy(c.p); c.obj.localToWorld(tmp);
      const pr = tmp.clone().project(camera);
      if (pr.z > 1 || Math.abs(pr.x) > 1.2 || Math.abs(pr.y) > 1.2) { c.el.style.opacity = 0; return; }
      const x = (pr.x * 0.5 + 0.5) * W2, y = (-pr.y * 0.5 + 0.5) * H2;
      c.el.style.opacity = vis;
      c.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
      // keep the tag on screen and inside the band not used by the caption / readouts
      const w = c.tag.offsetWidth, h = c.tag.offsetHeight;
      let left = x + c.dx - (c.dx < 0 ? w : c.dx === 0 ? w / 2 : 0), top = y + c.dy - h / 2;
      left = clamp(left, 8, W2 - w - 8); top = clamp(top, band[0], Math.max(band[0], band[1] - h));
      const ex = clamp(x, left, left + w) - x, ey = top + h / 2 - y;
      c.line.style.width = Math.hypot(ex, ey) + 'px'; c.line.style.transform = `rotate(${Math.atan2(ey, ex)}rad)`;
      c.tag.style.transform = `translate(${(left - x).toFixed(1)}px, ${(top - y).toFixed(1)}px)`;
      c.el.classList.toggle('x', X > 0.5);
    });

    // HUD
    const seg = SEG.find(s => t >= s[0] && t < s[1]) || SEG[0];
    ui.gStage.textContent = seg[2];
    ui.gGun.textContent = t >= FIRE && t < FIRE + 2.5 ? 'Fired' : t >= FIRE + 2.5 && t < FIRE + 6 ? 'Reloading' : 'Ready';
    let kmh = 0;
    if (pipDrone >= 0) { const st = droneState(pipDrone, t); if (st) kmh = st.kmh; }
    else { for (let i = 0; i < 4; i++) { const st = droneState(i, t); if (st) { kmh = st.kmh; break; } } }
    ui.gVel.textContent = Math.round(kmh) + ' km/h';
    let ci = CAPTIONS.findIndex(c => t >= c[0] && t < c[1]); if (ci < 0) ci = 0;
    if (ci !== lastCap) {
      lastCap = ci; const c = CAPTIONS[ci];
      const apply = () => { ui.capStep.textContent = c[2]; ui.capStep.className = 'step' + (c[4] ? ' x' : ''); ui.capText.textContent = c[3]; ui.cap.classList.remove('swap'); };
      if (videoMode) apply(); else { ui.cap.classList.add('swap'); setTimeout(apply, 180); }
    }
    ui.fill.style.width = (t / LOOP * 100) + '%';
    if (document.activeElement !== ui.scrub) ui.scrub.value = Math.round(t / LOOP * 1000);
    ui.time.textContent = t.toFixed(1) + ' / ' + LOOP + ' s';

    // drone camera picture-in-picture
    pipState = null;
    ui.pip.hidden = pipDrone < 0;
    if (pipDrone >= 0) {
      const i = pipDrone, lost = t >= IMPACT[i];
      ui.pipLbl.textContent = (i === 3 ? 'Switchblade 600' : 'Switchblade 300') + ' · #' + (i + 1) + ' · EO';
      const locked = !lost && droneState(i, t) && t > paths[i].enter - 2.5;
      ui.pipLock.textContent = lost ? 'Signal lost' : locked ? (droneState(i, t).phase === 'dive' ? 'Diving' : 'Target locked') : 'Searching';
      ui.pipStatic.hidden = !lost;
      if (lost) {
        const cx = ui.pipStatic.getContext('2d'), img = cx.createImageData(96, 60);
        for (let k = 0; k < img.data.length; k += 4) { const v = rand(k, Math.floor(t * 30)) * 255; img.data[k] = img.data[k + 1] = img.data[k + 2] = v; img.data[k + 3] = 255; }
        cx.putImageData(img, 0, 0);
      } else {
        const d = flyDrones[i].g;
        pipCam.position.copy(d.localToWorld(V(0.62, -0.02, 0)));
        const tg = paths[i].target.clone(); tg.y = 1.2;
        pipCam.lookAt(tg);
        pipState = { hide: d };
      }
    }
  }

  function render() {
    composer.render();
    if (pipState) {
      const r = ui.pip.getBoundingClientRect(), H = stage.clientHeight || innerHeight;
      pipCam.aspect = r.width / r.height; pipCam.updateProjectionMatrix();
      pipState.hide.visible = false;
      const keepEnc = renderer.outputEncoding;
      renderer.outputEncoding = T.sRGBEncoding;
      renderer.setRenderTarget(null);
      renderer.setScissorTest(true);
      renderer.setScissor(r.left, H - r.bottom, r.width, r.height);
      renderer.setViewport(r.left, H - r.bottom, r.width, r.height);
      renderer.autoClear = true;
      renderer.render(scene, pipCam);
      renderer.setScissorTest(false);
      renderer.setViewport(0, 0, stage.clientWidth || innerWidth, H);
      renderer.outputEncoding = keepEnc;
      pipState.hide.visible = true;
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!videoMode) {
      if (playing) t = (t + dt * speed) % LOOP;
      update(t, now / 1000);
      render();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__seek = (time, opts = {}) => { playing = false; setPlayIcon(); t = time; if (opts.x) xMode = opts.x; update(t, videoMode ? time : 0); render(); };
  window.__video = (dpr = 3) => {
    videoMode = true; document.body.classList.add('video');
    renderer.setPixelRatio(dpr); composer.setPixelRatio(dpr); resize();
  };
})();
</script>
