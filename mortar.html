<title>Mortar Trajectory X-Ray</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed WebGL stage; title + gauges in the top corners, caption and transport bar along the bottom edge */
  :root {
    --ink: #0a0b0d;
    --panel: rgba(14, 16, 19, 0.72);
    --line: rgba(196, 210, 222, 0.16);
    --fg: #e8ecef;
    --muted: #8c959e;
    --xray: #74d4ff;
    --flash: #ffb24a;
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--fg);
    font-family: var(--mono);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }

  .hud {
    position: fixed; inset: 0;
    pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .brand h1 {
    margin: 0;
    font-family: var(--display); font-weight: 700;
    font-size: clamp(22px, 3.2vw, 34px); line-height: 0.95;
    letter-spacing: 0.02em; text-transform: uppercase;
  }
  .brand p {
    margin: 6px 0 0; color: var(--muted);
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .mode {
    display: inline-block; margin-top: 10px; padding: 3px 8px;
    border: 1px solid var(--xray); color: var(--xray);
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    opacity: 0; transition: opacity .3s;
  }
  .mode.on { opacity: 1; }

  .gauges {
    display: grid; grid-template-columns: auto auto; column-gap: 14px; row-gap: 5px;
    padding: 10px 12px; background: var(--panel); border: 1px solid var(--line);
    font-size: 11px; font-variant-numeric: tabular-nums;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .gauges dt { color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; align-self: center; }
  .gauges dd { margin: 0; text-align: right; min-width: 9ch; }
  .pips { display: inline-flex; gap: 4px; vertical-align: middle; }
  .pips i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid #c9a24f; background: #c9a24f; }
  .pips i.spent { background: transparent; border-color: #6a5a3a; }
  .pips i.empty { background: transparent; border-color: #3a3f45; }

  .bottom { display: flex; flex-direction: column; gap: 12px; }
  .caption { max-width: 46ch; min-height: 92px; display: flex; flex-direction: column; justify-content: flex-end; }
  .caption .step {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--flash);
    min-height: 1.3em;
  }
  .caption .step.x { color: var(--xray); }
  .caption .text {
    margin: 4px 0 0;
    font-family: var(--display); font-weight: 600;
    font-size: clamp(19px, 2.4vw, 27px); line-height: 1.12; text-wrap: balance;
    text-shadow: 0 1px 12px rgba(0,0,0,.6);
  }
  .caption > * { transition: opacity .25s; }
  .caption.swap > * { opacity: 0; }

  .transport {
    pointer-events: auto;
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px;
    padding: 8px 10px; background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .transport button {
    font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--fg); background: transparent; border: 1px solid var(--line);
    padding: 8px 10px; min-height: 32px; cursor: pointer; white-space: nowrap;
  }
  .transport button:hover { border-color: var(--muted); }
  .transport button:focus-visible, .scrub input:focus-visible { outline: 2px solid var(--xray); outline-offset: 2px; }
  .transport button[aria-pressed="true"] { border-color: var(--xray); color: var(--xray); }
  #play { width: 40px; padding: 0; display: grid; place-items: center; }
  #play svg { width: 12px; height: 12px; fill: currentColor; }
  .scrub { flex: 1 1 220px; min-width: 0; position: relative; height: 32px; display: flex; align-items: center; }
  .scrub input { width: 100%; margin: 0; appearance: none; -webkit-appearance: none; background: transparent; height: 32px; position: relative; z-index: 1; cursor: pointer; }
  .scrub input::-webkit-slider-runnable-track { height: 2px; background: transparent; }
  .scrub input::-moz-range-track { height: 2px; background: transparent; }
  .scrub input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%; background: var(--fg); border: 0; }
  .scrub input::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--fg); border: 0; }
  .track { position: absolute; left: 6px; right: 6px; top: 15px; height: 2px; background: var(--line); }
  .track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--muted); }
  .track .seg { position: absolute; top: -3px; height: 8px; border-left: 1px solid var(--muted); }
  .track .seg.x { background: rgba(116, 212, 255, 0.18); border-left-color: var(--xray); }
  .time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 9ch; text-align: right; }
  .hint { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; }

  /* Shorts recording layout (9:16): keeps text clear of the YouTube Shorts overlay at the bottom and right edge */
  body.video .transport { display: none; }
  body.video .hud { padding-top: 30px; }
  body.video .top { flex-direction: column; gap: 0; }
  body.video .brand h1 { font-size: 30px; }
  body.video .brand p { display: block; font-size: 9px; }
  body.video .mode { position: absolute; top: 34px; right: 16px; margin: 0; }
  body.video .gauges {
    position: absolute; left: 16px; right: 16px; top: 66%;
    grid-template-columns: none; grid-template-rows: auto auto; grid-auto-flow: column;
    column-gap: 8px; row-gap: 3px; padding: 8px 10px; font-size: 10px;
  }
  body.video .gauges dt { font-size: 8px; }
  body.video .gauges dd { text-align: left; min-width: 0; white-space: nowrap; }
  body.video .bottom { position: absolute; top: 128px; left: 16px; right: 60px; }
  body.video .caption { min-height: 0; justify-content: flex-start; }
  body.video .caption .text { font-size: 19px; }
  body.video .caption > * { transition: none; }

  @media (max-width: 640px) {
    .gauges { font-size: 10px; padding: 8px 10px; column-gap: 10px; }
    .gauges dd { min-width: 7ch; }
    .brand p { display: none; }
    .caption { min-height: 76px; }
    .hint { display: none; }
  }
  @media (max-width: 420px) {
    .top { flex-direction: column; }
  }
</style>

<div id="stage"></div>

<div class="hud">
  <div class="top">
    <div class="brand">
      <h1>81 mm<br>Mortar</h1>
      <p>Smoothbore · drop-fired · 60° elevation</p>
      <span class="mode" id="modeTag">X-ray view</span>
    </div>
    <dl class="gauges" aria-label="Live readouts">
      <dt>Stage</dt><dd id="gStage">Ready</dd>
      <dt>Altitude</dt><dd id="gAlt">0 m</dd>
      <dt>Speed</dt><dd id="gVel">0 m/s</dd>
      <dt>Range</dt><dd id="gRange">0 m</dd>
      <dt>Flight</dt><dd id="gTime">0.0 s</dd>
    </dl>
  </div>

  <div class="bottom">
    <div class="caption" id="caption" aria-live="polite">
      <div class="step" id="capStep"></div>
      <p class="text" id="capText"></p>
    </div>
    <div class="transport">
      <button id="play" aria-label="Pause"><svg viewBox="0 0 12 12" id="playIcon"><rect x="1" y="1" width="3.5" height="10"/><rect x="7.5" y="1" width="3.5" height="10"/></svg></button>
      <div class="scrub">
        <div class="track" id="track"><div class="fill" id="fill"></div></div>
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Timeline">
      </div>
      <span class="time" id="time">0.0 s</span>
      <button id="xray" aria-pressed="false" title="X-ray: auto, on, off">X-ray: Auto</button>
      <button id="speed" title="Playback speed">1×</button>
      <button id="cam" aria-pressed="false" title="Drag the scene to orbit freely">Camera: Director</button>
      <span class="hint">Drag to orbit</span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
  const T = THREE;
  const PI = Math.PI;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = k => { k = clamp(k); return k * k * (3 - 2 * k); };
  const easeOut = k => { k = clamp(k); return 1 - Math.pow(1 - k, 3); };
  const span = (t, a, b) => clamp((t - a) / (b - a));
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (i, j) => { const x = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return x - Math.floor(x); };

  // ---------------------------------------------------------------- renderer
  const stage = document.getElementById('stage');
  const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  stage.appendChild(renderer.domElement);
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(32, 1, 0.1, 2000);

  {
    const env = new T.Scene();
    env.add(new T.Mesh(new T.BoxGeometry(60, 30, 60), new T.MeshBasicMaterial({ color: 0x050607, side: T.BackSide })));
    const box = (w, h, x, y, z, ry, rx, c) => {
      const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: c, side: T.DoubleSide }));
      m.position.set(x, y, z); m.rotation.set(rx || 0, ry || 0, 0); env.add(m);
    };
    box(40, 6, 0, 14, 0, 0, PI / 2, new T.Color(3.0, 3.0, 3.1));
    box(4, 22, -24, 2, 8, PI / 2.6, 0, new T.Color(2.2, 2.3, 2.5));
    box(4, 22, 24, 2, -6, -PI / 2.4, 0, new T.Color(1.6, 1.7, 2.0));
    box(30, 3, 0, 4, -28, 0, 0, new T.Color(1.5, 1.2, 0.85));
    scene.environment = new T.PMREMGenerator(renderer).fromScene(env, 0.02).texture;
  }
  const key = new T.DirectionalLight(0xfff4e6, 1.4); key.position.set(30, 60, 40); scene.add(key);
  const rim = new T.DirectionalLight(0xbfd8ff, 0.7); rim.position.set(-40, 20, -30); scene.add(rim);
  scene.add(new T.HemisphereLight(0x8fa0b0, 0x2a2618, 0.45));

  const bgMat = new T.ShaderMaterial({
    uniforms: { uX: { value: 0 }, uRes: { value: new T.Vector2(1, 1) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.0); }',
    fragmentShader: `
      varying vec2 vUv; uniform float uX; uniform vec2 uRes;
      void main(){
        // dusk sky for the solid view, x-ray light box otherwise
        vec3 solid = mix(vec3(0.012, 0.014, 0.016), vec3(0.045, 0.05, 0.06), smoothstep(0.1, 0.9, vUv.y));
        vec2 c = vUv - vec2(0.5, 0.56); c.x *= uRes.x / uRes.y; float r = length(c);
        vec3 xr = mix(vec3(0.006, 0.032, 0.055), vec3(0.0, 0.004, 0.009), smoothstep(0.0, 0.95, r));
        vec2 g = gl_FragCoord.xy / (uRes.y / 18.0); vec2 f = abs(fract(g) - 0.5);
        float line = 1.0 - smoothstep(0.0, 0.035, min(f.x, f.y));
        xr += vec3(0.010, 0.040, 0.060) * line * (1.0 - smoothstep(0.2, 1.0, r));
        gl_FragColor = vec4(mix(solid, xr, uX), 1.0);
      }`,
    depthWrite: false, depthTest: false
  });
  const bg = new T.Mesh(new T.PlaneGeometry(2, 2), bgMat);
  bg.frustumCulled = false; bg.renderOrder = -10; scene.add(bg);

  // ---------------------------------------------------------------- helpers
  const alongX = g => g.rotateZ(-PI / 2);
  const lathe = (pts, seg = 48) => alongX(new T.LatheGeometry(pts.map(([r, x]) => new T.Vector2(r, x)), seg));
  const latheY = (pts, seg = 64) => new T.LatheGeometry(pts.map(([r, y]) => new T.Vector2(r, y)), seg);
  const canvasTex = (w, h, draw) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h); const t = new T.CanvasTexture(cv); t.wrapS = t.wrapT = T.RepeatWrapping; return t; };

  // ---------------------------------------------------------------- materials
  const steel = new T.MeshStandardMaterial({ color: 0x3a3f44, metalness: 0.75, roughness: 0.4, envMapIntensity: 1.1 });
  const steelDark = new T.MeshStandardMaterial({ color: 0x1c1f22, metalness: 0.8, roughness: 0.45 });
  const plateMat = new T.MeshStandardMaterial({ color: 0x23272b, metalness: 0.6, roughness: 0.55 });
  const roundGreen = new T.MeshStandardMaterial({ color: 0x1f3a26, metalness: 0.1, roughness: 0.6, envMapIntensity: 0.45 });
  const band = new T.MeshStandardMaterial({ color: 0x2bb3a3, metalness: 0.1, roughness: 0.45 });
  const fuzeMat = new T.MeshStandardMaterial({ color: 0xc9ced3, metalness: 1, roughness: 0.25 });
  const boomTex = canvasTex(64, 128, (x, w, h) => {
    x.fillStyle = '#9a9ca6'; x.fillRect(0, 0, w, h); x.fillStyle = '#26272b';
    for (let j = 0; j < 8; j++) for (let i = 0; i < 4; i++) { x.beginPath(); x.arc(8 + i * 16 + (j % 2) * 8, 8 + j * 16, 3.2, 0, 2 * PI); x.fill(); }
  });
  boomTex.repeat.set(3, 3);
  const boomMat = new T.MeshStandardMaterial({ map: boomTex, metalness: 0.4, roughness: 0.5 });
  const greyMat = new T.MeshStandardMaterial({ color: 0x8e9099, metalness: 0.2, roughness: 0.6 });
  const chargeMat = new T.MeshStandardMaterial({ color: 0xa9a49a, metalness: 0, roughness: 0.85, emissive: 0x000000 });
  const brass = new T.MeshStandardMaterial({ color: 0xc99a45, metalness: 1, roughness: 0.3, emissive: 0x000000 });
  const fillMat = new T.MeshStandardMaterial({ color: 0x5e5638, metalness: 0, roughness: 0.85, emissive: 0x000000 });
  const groundTex = canvasTex(256, 256, (x, w, h) => {
    x.fillStyle = '#3a3a24'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) {
      const g = 40 + rand(i, 1) * 60;
      x.fillStyle = `rgba(${g + 15},${g + 20},${g * 0.55},${0.25 + rand(i, 2) * 0.4})`;
      x.fillRect(rand(i, 3) * w, rand(i, 4) * h, 1 + rand(i, 5) * 3, 1 + rand(i, 6) * 5);
    }
  });
  groundTex.repeat.set(220, 165); groundTex.encoding = T.sRGBEncoding;
  const groundMat = new T.MeshStandardMaterial({ map: groundTex, color: 0x9a9a8a, metalness: 0, roughness: 0.95, envMapIntensity: 0.25 });

  const xrayMats = [];
  function xray(color, fillA = 0.04, power = 2.0) {
    const m = new T.ShaderMaterial({
      uniforms: { uColor: { value: new T.Color(color) }, uOpacity: { value: 0 }, uFill: { value: fillA }, uPow: { value: power } },
      vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
      fragmentShader: 'varying vec3 vN; varying vec3 vV; uniform vec3 uColor; uniform float uOpacity; uniform float uFill; uniform float uPow; void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), uPow); gl_FragColor = vec4(uColor, (f * 0.6 + uFill) * uOpacity * 0.6); }',
      transparent: true, depthWrite: false, blending: T.AdditiveBlending, side: T.DoubleSide
    });
    xrayMats.push(m); return m;
  }
  const xShell = xray(0x5cc8ff, 0.03, 2.2);
  const xRound = xray(0x9fe0c0, 0.03, 2.0);
  const xInner = xray(0xd8f3ff, 0.06, 1.6);

  const shells = [];
  const fadeMats = [steel, steelDark, plateMat, roundGreen, band, fuzeMat, boomMat, greyMat];
  function part(geo, mat, xmat, parent) {
    const g = new T.Group();
    const solid = new T.Mesh(geo, mat), ghost = new T.Mesh(geo, xmat);
    ghost.renderOrder = 5; g.add(solid); g.add(ghost); parent.add(g);
    shells.push({ solid, ghost }); return g;
  }

  // ---------------------------------------------------------------- ground, range markers
  const ground = new T.Mesh(new T.PlaneGeometry(4000, 3000), groundMat);
  ground.rotation.x = -PI / 2; ground.position.set(160, 0, 0); scene.add(ground);
  const labelSprites = [];
  function label(text, color) {
    const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 128;
    const tex = new T.CanvasTexture(cv);
    const draw = () => {
      const x = cv.getContext('2d'); x.clearRect(0, 0, 1024, 128);
      x.font = '600 76px "Barlow Condensed", "Arial Narrow", sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillStyle = color; x.fillText(text, 512, 64); tex.needsUpdate = true;
    };
    draw(); document.fonts && document.fonts.ready.then(draw);
    const s = new T.Sprite(new T.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false }));
    s.renderOrder = 20; scene.add(s); labelSprites.push(s); return s;
  }

  // ---------------------------------------------------------------- mortar (base socket at BASE, tube along local +x)
  const ELEV = PI / 3, TUBE_LEN = 13, BORE = 0.41;
  const BASE = new T.Vector3(0, 0.55, 0);
  const DIR = new T.Vector3(Math.cos(ELEV), Math.sin(ELEV), 0);
  {
    // baseplate dish + socket
    const bp = latheY([[0, 0.05], [2.4, 0.05], [2.7, 0.12], [2.78, 0.3], [2.68, 0.4], [2.45, 0.3], [0.9, 0.42], [0.7, 0.62], [0, 0.62]]);
    part(bp, plateMat, xShell, scene);
    for (let k = 0; k < 8; k++) {
      const rib = new T.Mesh(new T.BoxGeometry(1.6, 0.12, 0.12), plateMat);
      rib.position.set(Math.cos(k * PI / 4) * 1.6, 0.36, Math.sin(k * PI / 4) * 1.6); rib.rotation.y = -k * PI / 4; scene.add(rib);
    }
  }
  const mortar = new T.Group(); scene.add(mortar);
  const tube = new T.Group(); tube.position.copy(BASE); tube.rotation.z = ELEV; mortar.add(tube);
  {
    const outer = [[0.3, -0.2], [0.52, -0.05], [0.52, 1.2], [0.48, 1.4], [0.48, 12.75], [0.53, 12.8], [0.53, 13.0]];
    const inner = [[BORE, 13.0], [BORE, 0.15], [0.0, 0.15]];
    part(lathe(outer.concat(inner), 56), steel, xShell, tube);
    const ball = new T.Mesh(new T.SphereGeometry(0.42, 24, 16), steelDark); ball.position.x = -0.25; tube.add(ball);
    // fixed firing pin at the bottom of the bore
    part(alongX(new T.CylinderGeometry(0.03, 0.09, 0.35, 12)).translate(0.32, 0, 0), steelDark, xInner, tube);
    // bipod clamp collar
    part(lathe([[0.5, 8.2], [0.64, 8.25], [0.64, 8.95], [0.5, 9.0]], 40), steelDark, xShell, tube);
  }
  // bipod, elevating column, traverse bar, handwheel, sight
  {
    const C = BASE.clone().addScaledVector(DIR, 8.6);
    const add = (geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) => { const m = part(geo, mat, xShell, mortar); m.position.set(x, y, z); m.rotation.set(rx, ry, rz); return m; };
    add(new T.CylinderGeometry(0.13, 0.13, 3.2, 14), steel, C.x + 0.35, C.y - 0.75, 0, PI / 2);          // traverse bar
    add(new T.TorusGeometry(0.45, 0.06, 8, 24), steelDark, C.x + 0.35, C.y - 0.75, 1.7);                  // traverse handwheel
    add(new T.CylinderGeometry(0.16, 0.16, 3.6, 14), steel, C.x + 0.6, C.y - 2.7, 0);                     // elevating column
    add(new T.CylinderGeometry(0.42, 0.42, 0.28, 18), steelDark, C.x + 0.6, C.y - 3.3, 0);                // elevating handwheel
    const sight = new T.Group(); sight.position.set(C.x + 0.2, C.y - 0.2, -1.1); mortar.add(sight);

    // impact: fuze crush, spark, burst
    const it = t - IMPACT;
    R.fuze.scale.x = it > 0 && it < 1.2 ? 1 - 0.6 * smooth(it / 0.35) : 1;
    fuzeSpark.visible = it > 0.3 && it < 0.75; fuzeSpark.scale.setScalar(0.9);
    const det = it > 0.6 && it < 1.1 ? clamp((it - 0.6) / 0.4) : 0;
    fillMat.emissive.setRGB(3 * det, 2.2 * det, 1.2 * det);
    const bi = t - (IMPACT + 1.0);
    const burstI = bi > 0 ? Math.exp(-bi / 0.55) : 0;
    burst.visible = burstI > 0.01; burst.position.set(LAND_X, 2.5, 0); burst.scale.setScalar(6 + (1 - burstI) * 22); burst.material.opacity = burstI;
    burstLight.position.set(LAND_X, 6, 0); burstLight.intensity = 10 * burstI;
    shock.visible = bi > 0 && bi < 2.2; shock.position.set(LAND_X, 0.15, 0);
    shock.scale.setScalar(1 + easeOut(bi / 2.2) * 45); shockMat.opacity = 0.45 * (1 - clamp(bi / 2.2));
    crater.visible = bi > 0 && t < 33.4; crater.position.set(LAND_X, 0.06, 0); crater.material.opacity = 0.85 * (1 - smooth(span(t, 32.6, 33.4)));
    frags.forEach((s, i) => {
      const k = bi / 1.6; s.visible = k > 0 && k < 1;
      if (!s.visible) return;
      const a = rand(i, 1) * 2 * PI, up = 0.2 + rand(i, 2) * 0.9, sp = 18 + rand(i, 3) * 26, kk = easeOut(k);
      s.position.set(LAND_X + Math.cos(a) * sp * kk, 1 + up * sp * 0.6 * kk - k * k * 8, Math.sin(a) * sp * kk);
      s.scale.setScalar(0.9 * (1 - k)); s.material.opacity = 1 - k;
    });

    // smoke: muzzle, baseplate dust, impact cloud
    let si = 0;
    const puff = (x, y, z, scale, op, rot, col) => {
      if (si >= smokePool.length || op <= 0.002) return;
      const s = smokePool[si++]; s.visible = true; s.position.set(x, y, z); s.scale.setScalar(scale); s.material.opacity = op; s.material.rotation = rot; s.material.color.setHex(col);
    };
    const mz = BASE.clone().addScaledVector(DIR, TUBE_LEN + 0.5);
    for (let p = 0; p < 16; p++) {
      const life = 3 + rand(p, 1) * 2, age = (t - LAUNCH[1] - p * 0.02) / life; if (age <= 0 || age >= 1) continue;
      const dist = (1 - Math.exp(-age * 5)) * (2 + p * 0.5), a = rand(p, 2) * 2 * PI;
      puff(mz.x + DIR.x * dist + Math.cos(a) * dist * 0.4, mz.y + DIR.y * dist * 0.7 + age * 3, Math.sin(a) * dist * 0.5, 1 + age * 6, 0.35 * Math.pow(1 - age, 1.4) * Math.min(1, age * 12), rand(p, 3) * 6, 0x9a9ea2);
    }
    for (let p = 0; p < 12; p++) {
      const life = 2 + rand(p, 4), age = (t - LAUNCH[1] - p * 0.02) / life; if (age <= 0 || age >= 1) continue;
      const a = rand(p, 5) * 2 * PI, dist = (1 - Math.exp(-age * 4)) * (3 + rand(p, 6) * 2);
      puff(Math.cos(a) * dist, 0.4 + age * 1.2, Math.sin(a) * dist, 0.8 + age * 3, 0.3 * Math.pow(1 - age, 1.6) * Math.min(1, age * 10), rand(p, 7) * 6, 0x7a6f58);
    }
    for (let p = 0; p < 40; p++) {
      const birth = IMPACT + 1.0 + p * 0.025, life = 4 + rand(p, 8) * 2.5, age = (t - birth) / life; if (age <= 0 || age >= 1) continue;
      const a = rand(p, 9) * 2 * PI, ring = 0.3 + rand(p, 10) * 0.7, dist = (1 - Math.exp(-age * 4)) * (6 + p * 0.35) * ring;
      puff(LAND_X + Math.cos(a) * dist, 1.5 + rand(p, 11) * 6 * age * 2 + age * 6, Math.sin(a) * dist, 4 + age * 14, 0.5 * Math.pow(1 - age, 1.3) * Math.min(1, age * 14), rand(p, 12) * 6, p % 3 ? 0x6e6350 : 0x4a4a46);
    }
    for (; si < smokePool.length; si++) smokePool[si].visible = false;

    // trajectory reveal + labels
    const reveal = t >= LAUNCH[1] && t < 33.6 ? clamp((t - LAUNCH[1]) / D) : 0;
    arc.visible = reveal > 0;
    arcGeo.setDrawRange(0, Math.floor(ARC_IDX * reveal / 36) * 36);
    arcMat.opacity = 0.75 * (1 - smooth(span(t, 32.8, 33.6)));
    apexLabel.visible = t > LAUNCH[1] + APEX_T && t < 33.6; apexLabel.position.set(APEX.x, APEX.y + 6, 0);
    landLabel.visible = t > IMPACT + 1.5 && t < 33.6; landLabel.position.set(LAND_X - 12, 18, 0);

    // x-ray blend
    const xr = xMode === 'on' ? 1 : xMode === 'off' ? 0 : xrayAuto(t);
    xrayAmount += (xr - xrayAmount) * (xMode === 'auto' ? 1 : 0.15);
    const X = xrayAmount;
    bgMat.uniforms.uX.value = X;
    xrayMats.forEach(mm => { mm.uniforms.uOpacity.value = X; });
    shells.forEach(({ solid, ghost }) => { ghost.visible = X > 0.005; solid.visible = X < 0.995; });
    fadeMats.forEach(mt => { mt.transparent = X > 0.005; mt.opacity = 1 - X; mt.depthWrite = X < 0.5; });
    groundMat.transparent = X > 0.005; groundMat.opacity = 1 - 0.85 * X;
    brass.emissive.setRGB(0.35 * X, 0.2 * X, 0.04 * X);
    if (det < 0.01) fillMat.emissive.setRGB(0.06 * X, 0.05 * X, 0.02 * X);
    if (burn < 0.01) chargeMat.emissive.setRGB(0.08 * X, 0.07 * X, 0.05 * X);
    ui.modeTag.classList.toggle('on', X > 0.5);
    bloom.strength = 0.55 - 0.25 * X;

    // camera
    if (camMode === 'director') {
      const c = camAt(t), fit = Math.max(1, (videoMode ? 1.55 : 1.45) / camera.aspect);
      const d = c.d * (c.d > 20 ? fit : Math.sqrt(fit));
      const target = v3.set(...c.tg);
      const shake = reducedMotion ? 0 : (blastI * 0.08 + burstI * 0.5) * Math.min(1, c.d / 20);
      camera.position.set(
        target.x + d * Math.sin(c.az) * Math.cos(c.el) + (rand(wall, 1) - 0.5) * shake,
        Math.max(1.2, target.y + d * Math.sin(c.el)) + (rand(wall, 2) - 0.5) * shake,
        target.z + d * Math.cos(c.az) * Math.cos(c.el));
      camera.lookAt(target);
      controls.target.copy(target);
    } else controls.update();
    // keep near/far tight around the subject: the composer's depth buffer is only 16-bit
    const camDist = camera.position.distanceTo(controls.target);
    camera.near = Math.max(0.2, camDist * 0.3); camera.far = camDist * 6 + 800;
    camera.updateProjectionMatrix();
    const fovK = 2 * Math.tan(camera.fov * PI / 360) * camera.aspect * (videoMode ? 0.055 : 0.03);  // label size as a share of screen width
    labelSprites.forEach(s => { const k = camera.position.distanceTo(s.position) * fovK; s.scale.set(k * 8, k, 1); });
    arcMat.opacity *= clamp((camDist - 12) / 50, 0.12, 1);

    // HUD
    ui.gStage.textContent = stage;
    ui.gAlt.textContent = Math.round(alt).toLocaleString('en-US') + ' m';
    ui.gVel.textContent = vel.toFixed(0) + ' m/s';
    ui.gRange.textContent = Math.round(rng).toLocaleString('en-US') + ' m';
    ui.gTime.textContent = tof.toFixed(1) + ' s';
    let ci = CAPTIONS.findIndex(c => t >= c[0] && t < c[1]); if (ci < 0) ci = 0;
    if (ci !== lastCap) {
      lastCap = ci; const c = CAPTIONS[ci];
      const apply = () => { ui.capStep.textContent = c[2]; ui.capStep.className = 'step' + (c[4] ? ' x' : ''); ui.capText.textContent = c[3]; ui.cap.classList.remove('swap'); };
      if (videoMode) apply(); else { ui.cap.classList.add('swap'); setTimeout(apply, 180); }
    }
    ui.fill.style.width = (t / LOOP * 100) + '%';
    if (document.activeElement !== ui.scrub) ui.scrub.value = Math.round(t / LOOP * 1000);
    ui.time.textContent = t.toFixed(1) + ' / ' + LOOP + ' s';
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!videoMode) {
      if (playing) t = (t + dt * speed) % LOOP;
      update(t, now / 1000);
      composer.render();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__seek = (time, opts = {}) => { playing = false; setPlayIcon(); t = time; if (opts.x) xMode = opts.x; update(t, videoMode ? time : 0); composer.render(); };
  window.__video = (dpr = 3) => {
    videoMode = true; document.body.classList.add('video');
    renderer.setPixelRatio(dpr); composer.setPixelRatio(dpr); resize();
  };
})();
</script>
