<title>X-Ray Model Shortlist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed viewer; model picker and credit card float over it */
  :root {
    --ink: #0a0b0d;
    --panel: rgba(14, 16, 19, 0.78);
    --line: rgba(196, 210, 222, 0.16);
    --fg: #e8ecef;
    --muted: #8c959e;
    --xray: #74d4ff;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--ink); color: var(--fg); font-family: var(--mono); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .hud {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1 { margin: 0; font: 700 clamp(22px, 3vw, 32px)/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
  .picker { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .picker button, .tools button {
    font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--fg); background: var(--panel); border: 1px solid var(--line);
    padding: 9px 12px; min-height: 34px; cursor: pointer;
  }
  .picker button[aria-pressed="true"] { border-color: var(--fg); }
  .tools button[aria-pressed="true"] { border-color: var(--xray); color: var(--xray); }
  button:focus-visible { outline: 2px solid var(--xray); outline-offset: 2px; }
  .card {
    pointer-events: auto; max-width: 52ch; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .card h2 { margin: 0 0 4px; font: 600 22px/1.1 var(--display); }
  .card p { margin: 0 0 8px; font-size: 12px; line-height: 1.5; color: var(--fg); }
  .card .lic { color: var(--muted); font-size: 11px; }
  .card .lic a { color: var(--xray); }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .status { font-size: 11px; color: var(--muted); }
</style>

<div id="stage"></div>
<div class="hud">
  <div>
    <h1>X-Ray Model Shortlist</h1>
    <p class="sub">Free models I can download · drag to orbit</p>
    <div class="picker" id="picker"></div>
  </div>
  <div class="card">
    <h2 id="name"></h2>
    <p id="pitch"></p>
    <p class="lic" id="lic"></p>
    <div class="tools">
      <button id="xray" aria-pressed="false">X-ray preview</button>
      <button id="spin" aria-pressed="true">Auto-rotate</button>
      <span class="status" id="status"></span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(() => {
  const T = THREE;
  const MODELS = [
    { id: 'ChronographWatch', name: 'Chronograph Watch',
      pitch: 'Separate hour, minute and second hands I can drive. X-ray idea: the mainspring, balance wheel and gear train ticking inside the case.',
      lic: '© 2025 Darmstadt Graphics Group GmbH · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · credit required (model by Eric Chadwick)' },
    { id: 'AntiqueCamera', name: 'Antique Camera',
      pitch: 'Bellows camera on a tripod. X-ray idea: light passing through the lens, the shutter opening and the image landing upside-down on the film.',
      lic: '© 2018 UX3D · <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0</a> · free to use, no credit needed (model by Maximillan Kamps)' },
    { id: 'BoomBox', name: 'Boom Box',
      pitch: 'Retro stereo. X-ray idea: the speaker cone, voice coil and magnet pushing air to make sound.',
      lic: '© 2017 Microsoft · <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0</a> · free to use, no credit needed' },
    { id: 'ToyCar', name: 'Toy Car',
      pitch: 'Glossy toy car with a glass canopy. X-ray idea: a pull-back motor, with the spring winding up and the gears driving the wheels.',
      lic: '© 2020 Guido Odendahl, Eric Chadwick · <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0</a> · free to use, no credit needed' },
  ];

  const stage = document.getElementById('stage');
  const renderer = new T.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.physicallyCorrectLights = true;
  stage.appendChild(renderer.domElement);
  const scene = new T.Scene();
  scene.background = new T.Color(0x0d0f12);
  const camera = new T.PerspectiveCamera(35, 1, 0.01, 1000);
  const controls = new T.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.2;

  // studio environment: dark room with softboxes
  {
    const env = new T.Scene();
    env.add(new T.Mesh(new T.BoxGeometry(60, 30, 60), new T.MeshBasicMaterial({ color: 0x0b0c0e, side: T.BackSide })));
    const box = (w, h, x, y, z, ry, rx, c) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: c, side: T.DoubleSide })); m.position.set(x, y, z); m.rotation.set(rx || 0, ry || 0, 0); env.add(m); };
    box(40, 6, 0, 14, 0, 0, Math.PI / 2, new T.Color(4, 4, 4.1));
    box(4, 22, -24, 2, 8, Math.PI / 2.6, 0, new T.Color(3, 3.1, 3.3));
    box(4, 22, 24, 2, -6, -Math.PI / 2.4, 0, new T.Color(2.2, 2.3, 2.6));
    box(30, 3, 0, 4, -28, 0, 0, new T.Color(2, 1.6, 1.1));
    scene.environment = new T.PMREMGenerator(renderer).fromScene(env, 0.02).texture;
  }
  const key = new T.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4); scene.add(key);

  const xrayMat = new T.ShaderMaterial({
    uniforms: { uColor: { value: new T.Color(0x5cc8ff) } },
    vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'varying vec3 vN; varying vec3 vV; uniform vec3 uColor; void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.0); gl_FragColor = vec4(uColor * (f * 0.9 + 0.04), 1.0); }',
    transparent: true, depthWrite: false, blending: T.AdditiveBlending, side: T.DoubleSide
  });

  const loader = new T.GLTFLoader();
  const cache = {};
  let current = null, xray = false, token = 0;
  const $ = id => document.getElementById(id);

  function applyXray(root) {
    root.traverse(o => {
      if (!o.isMesh) return;
      if (!o.userData.mat) o.userData.mat = o.material;
      o.material = xray ? xrayMat : o.userData.mat;
    });
    scene.background.setHex(xray ? 0x03101a : 0x0d0f12);
  }
  // r128 renders KHR_materials_transmission poorly; show glass as plain see-through instead
  function fixGlass(root) {
    root.traverse(o => {
      if (!o.isMesh || o.userData.glassFixed) return;
      const mt = o.material;
      if (mt && mt.transmission > 0) { mt.transmission = 0; mt.transparent = true; mt.opacity = 0.18; mt.depthWrite = false; mt.needsUpdate = true; }
      o.userData.glassFixed = true;
    });
  }
  function frame(root) {
    const box = new T.Box3().setFromObject(root), size = box.getSize(new T.Vector3()), c = box.getCenter(new T.Vector3());
    const r = size.length() / 2;
    controls.target.copy(c);
    const d = r / Math.sin(camera.fov * Math.PI / 360) * (camera.aspect < 1 ? 1.6 : 1.05);
    camera.position.set(c.x + d * 0.55, c.y + d * 0.25, c.z + d * 0.8);
    camera.near = r / 100; camera.far = r * 100; camera.updateProjectionMatrix();
    controls.minDistance = r * 0.4; controls.maxDistance = r * 8;
  }
  function show(i) {
    const m = MODELS[i];
    [...$('picker').children].forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
    $('name').textContent = m.name; $('pitch').textContent = m.pitch; $('lic').innerHTML = m.lic;
    if (current) scene.remove(current);
    current = null;
    const my = ++token;
    const done = gltf => {
      if (my !== token) return;  // a newer pick superseded this load
      if (current) scene.remove(current);
      current = gltf.scene; scene.add(current); fixGlass(current); applyXray(current); frame(current); $('status').textContent = '';
    };
    if (cache[m.id]) return done(cache[m.id]);
    $('status').textContent = 'Loading…';
    loader.load(m.id + '.glb', g => { cache[m.id] = g; done(g); },
      e => { if (e.total) $('status').textContent = 'Loading ' + Math.round(e.loaded / e.total * 100) + '%'; },
      () => { $('status').textContent = 'Could not load this model.'; });
  }
  MODELS.forEach((m, i) => { const b = document.createElement('button'); b.textContent = m.name; b.onclick = () => show(i); $('picker').appendChild(b); });
  $('xray').onclick = () => { xray = !xray; $('xray').setAttribute('aria-pressed', String(xray)); if (current) applyXray(current); };
  $('spin').onclick = () => { controls.autoRotate = !controls.autoRotate; $('spin').setAttribute('aria-pressed', String(controls.autoRotate)); };

  function resize() {
    const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();
  (function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
  show(0);
})();
</script>
