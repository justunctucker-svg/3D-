<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refueling in Orbit · NovexDynamics</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Designed for a 360 × 640 CSS-pixel viewport rendered at 3× (1080 × 1920). Safe margin: 20 CSS px (60 px) all round,
     with the stats bar kept above the bottom ~150 CSS px and clear of the Shorts action buttons on the right. */
  :root {
    --ink: #f2efe8;
    --dim: rgba(242, 239, 232, 0.55);
    --orange: #ff9a3c;
    --cyan: #5fd8ff;
    --chip: rgba(9, 13, 19, 0.82);
    --bar: rgba(8, 11, 16, 0.72);
  }
  html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
  /* The 360 × 640 frame is scaled to fit the window when the page is opened directly; the renderer uses it at 1:1. */
  #frame { position: absolute; left: 0; top: 0; width: 360px; height: 640px; overflow: hidden; transform-origin: 0 0; background: #10151c; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .ui { position: absolute; inset: 0; pointer-events: none; color: var(--ink); }
  .head { position: absolute; left: 20px; top: 22px; right: 20px; }
  .title { font: 700 35px/0.9 'Barlow Condensed', sans-serif; letter-spacing: 0.01em; text-transform: uppercase; margin: 0; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45); }
  .specs { margin-top: 7px; font: 500 7.6px/1.2 'IBM Plex Mono', monospace; letter-spacing: 0.08em; color: var(--dim); text-transform: uppercase; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6); }
  .step { margin-top: 15px; height: 12px; font: 600 9.6px/12px 'IBM Plex Mono', monospace; letter-spacing: 0.1em; color: var(--orange); text-transform: uppercase; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.75), 0 0 2px rgba(0, 0, 0, 0.6); }
  .step.x { color: var(--cyan); }
  .caption { margin-top: 4px; max-width: 320px; font: 600 19.5px/1.12 'Barlow Condensed', sans-serif; color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6), 0 0 2px rgba(0, 0, 0, 0.5); }
  .caption.huge { margin-top: 10px; max-width: 320px; font-size: 36px; line-height: 1.0; font-weight: 700; text-transform: uppercase; letter-spacing: 0.005em; }
  .caption.big { font-size: 28px; line-height: 1.04; font-weight: 700; }
  .teaser { margin-top: 7px; font: 500 8.4px/1.2 'IBM Plex Mono', monospace; letter-spacing: 0.06em; color: var(--cyan); text-shadow: 0 0 6px rgba(95, 216, 255, 0.5); opacity: 0; }
  .badge { position: absolute; right: 20px; top: 117px; padding: 3px 7px 3px 8px; border: 1px solid var(--cyan); color: var(--cyan); font: 600 8px/1 'IBM Plex Mono', monospace; letter-spacing: 0.14em; text-shadow: 0 0 6px rgba(95, 216, 255, 0.6); box-shadow: 0 0 8px rgba(95, 216, 255, 0.25), inset 0 0 6px rgba(95, 216, 255, 0.15); background: rgba(4, 16, 28, 0.55); }
  .bar { position: absolute; left: 20px; right: 56px; bottom: 150px; padding: 7px 10px 8px; background: var(--bar); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 3px; display: grid; grid-template-columns: 1.05fr 1fr 1fr 1fr; column-gap: 8px; }
  .bar .k { font: 500 6.4px/1 'IBM Plex Mono', monospace; letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; }
  .bar .v { margin-top: 4px; font: 600 10.4px/1 'IBM Plex Mono', monospace; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .approx { position: absolute; right: 7px; top: -9px; padding: 1px 4px; font: 600 5.6px/1.3 'IBM Plex Mono', monospace; letter-spacing: 0.14em; color: rgba(242, 239, 232, 0.75); background: rgba(8, 11, 16, 0.85); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 2px; }
  .callout { position: absolute; left: 0; top: 0; opacity: 0; }
  .callout .line { position: absolute; left: 0; top: 0; height: 1px; background: rgba(255, 255, 255, 0.75); transform-origin: 0 50%; }
  .callout .dot { position: absolute; left: -2.5px; top: -2.5px; width: 5px; height: 5px; border-radius: 50%; background: #fff; box-shadow: 0 0 5px rgba(255, 255, 255, 0.7); }
  .callout .tag { position: absolute; left: 0; top: 0; padding: 3px 6px; white-space: nowrap; font: 600 7.4px/1 'IBM Plex Mono', monospace; letter-spacing: 0.1em; color: var(--ink); background: var(--chip); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 2px; }
  .callout.x .line { background: rgba(95, 216, 255, 0.85); }
  .callout.x .dot { background: var(--cyan); box-shadow: 0 0 6px rgba(95, 216, 255, 0.9); }
  .callout.x .tag { border-color: rgba(95, 216, 255, 0.55); }
  .callout.fuel .tag { border-color: rgba(255, 128, 104, 0.85); }
  .callout.fuel .dot { background: #ff9a84; }
  .callout.ox .tag { border-color: rgba(120, 186, 255, 0.9); }
  .callout.ox .dot { background: #9cc8ff; }
  .chip { position: absolute; left: 0; top: 0; opacity: 0; white-space: nowrap; padding: 4px 6px 4px; background: var(--chip); border: 1px solid rgba(95, 216, 255, 0.6); border-radius: 2px; }
  .chip .k { font: 500 6px/1 'IBM Plex Mono', monospace; letter-spacing: 0.12em; color: rgba(95, 216, 255, 0.85); }
  .chip .v { margin-top: 3px; font: 600 10.4px/1 'IBM Plex Mono', monospace; color: var(--ink); font-variant-numeric: tabular-nums; }
  .wm { position: absolute; right: 56px; bottom: 134px; font: 600 6.6px/1 'IBM Plex Mono', monospace; letter-spacing: 0.22em; color: rgba(242, 239, 232, 0.5); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
  /* big LANDER FUEL counter: the spine of the video */
  .timer { position: absolute; right: 20px; top: 21px; text-align: right; }
  .timer.zero .v { color: #fff; text-shadow: 0 0 10px rgba(95, 216, 255, 0.6), 0 1px 4px rgba(0, 0, 0, 0.6); }
  .timer.zero .v small { color: rgba(255, 255, 255, 0.7); }
  .timer .k { font: 500 7.2px/1 'IBM Plex Mono', monospace; letter-spacing: 0.16em; color: var(--dim); }
  .timer .v { margin-top: 3px; font: 600 38px/1 'IBM Plex Mono', monospace; letter-spacing: -0.02em; color: var(--orange); font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(255, 154, 60, 0.45), 0 1px 4px rgba(0, 0, 0, 0.6); }
  .timer .v small { font-size: 15px; margin-left: 2px; color: rgba(255, 154, 60, 0.75); }
  .rewind { position: absolute; left: 20px; top: 0; opacity: 0; font: 600 13px/1 'IBM Plex Mono', monospace; letter-spacing: 0.12em; color: #fff; text-shadow: 2px 0 0 rgba(255, 40, 80, 0.7), -2px 0 0 rgba(40, 200, 255, 0.7); }
  .timer .il { margin-top: 3px; display: inline-block; padding: 1px 4px; font: 600 5.4px/1.3 'IBM Plex Mono', monospace; letter-spacing: 0.14em; color: rgba(242, 239, 232, 0.7); background: rgba(8, 11, 16, 0.7); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 2px; }
  .sub { margin-top: 7px; max-width: 300px; font: 600 15px/1.15 'Barlow Condensed', sans-serif; color: rgba(255, 255, 255, 0.92); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7); opacity: 0; }
  .callout .tag small.cl { color: var(--orange); }
  .callout .tag small { display: block; margin-top: 3px; font: 500 5.4px/1 'IBM Plex Mono', monospace; letter-spacing: 0.12em; color: rgba(95, 216, 255, 0.85); }
  .timer.full .v { color: #fff; text-shadow: 0 0 12px rgba(95, 216, 255, 0.75), 0 1px 4px rgba(0, 0, 0, 0.6); }
  .timer.full .v small { color: rgba(255, 255, 255, 0.75); }
  /* WEIGHTLESS warning tag (03): red outline, flickers */
  .wl { position: absolute; right: 20px; top: 166px; padding: 3px 7px 3px 8px; border: 1px solid #ff4b4b; color: #ff6a5e; font: 600 8px/1 'IBM Plex Mono', monospace; letter-spacing: 0.16em; text-shadow: 0 0 6px rgba(255, 75, 75, 0.7); box-shadow: 0 0 8px rgba(255, 75, 75, 0.3), inset 0 0 6px rgba(255, 75, 75, 0.18); background: rgba(28, 6, 6, 0.6); opacity: 0; }
  .sub.small { font-size: 13px; color: rgba(255, 255, 255, 0.85); }
</style>
</head>
<body>
<div id="frame">
<div id="stage"></div>
<div class="ui">
  <div id="callouts"></div>
  <div class="head">
    <h1 class="title">Refueling<br>in orbit</h1>
    <div class="specs" id="specs">Super-cold propellant · in-space transfer · microgravity</div>
    <div class="step" id="step"></div>
    <div class="caption" id="caption"></div>
    <div class="sub small" id="sub">Nobody has done this at this scale.</div>
    <div class="teaser" id="teaser">Next: the trick that fixes it.</div>
  </div>
  <div class="timer" id="timer"><div class="k">LANDER FUEL</div><div class="v"><span id="timerV">100</span><small>%</small></div><div class="il">APPROX.</div></div>
  <div class="wm">NOVEXDYNAMICS</div>
  <div class="rewind" id="rewind">&#9664;&#9664; REWIND</div>
  <div class="badge" id="badge">X-RAY VIEW</div>
  <div class="wl" id="wl">WEIGHTLESS</div>
  <div class="bar" id="bar">
    <span class="approx">APPROX.</span>
    <div><div class="k">Stage</div><div class="v" id="vStage">—</div></div>
    <div><div class="k">Tanker fuel</div><div class="v" id="vTanker">—</div></div>
    <div><div class="k">Lander fuel</div><div class="v" id="vLander">—</div></div>
    <div><div class="k">Transfer</div><div class="v" id="vTransfer">—</div></div>
  </div>
</div>
</div>
<script src="node_modules/three/build/three.min.js"></script>
<script src="node_modules/three/examples/js/shaders/CopyShader.js"></script>
<script src="node_modules/three/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="node_modules/three/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="node_modules/three/examples/js/postprocessing/EffectComposer.js"></script>
<script src="node_modules/three/examples/js/postprocessing/ShaderPass.js"></script>
<script src="node_modules/three/examples/js/postprocessing/RenderPass.js"></script>
<script src="node_modules/three/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="node_modules/three/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="refuel.js"></script>
</body>
</html>
